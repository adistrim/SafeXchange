[package]
name = "server-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["tokio", "http1"] }
hyper = "0.14"

# Async runtime
tokio = { version = "1.29.1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"

# Configuration and serialization
dotenv = "0.15.0"
serde = { version = "1.0", features = ["derive"] }

# UUID generation
uuid = "1.4"
